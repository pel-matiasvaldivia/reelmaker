# Reel Refurb en tu propio VPS.
#
#   docker compose pull && docker compose up -d        → solo la app, en el puerto 8080
#   docker compose --profile tls up -d                 → ademas Caddy con HTTPS automatico
#
# Las variables se toman de .env (copiá .env.example).
services:
  reelmaker:
    image: ${REELMAKER_IMAGE:-ghcr.io/pel-matiasvaldivia/reelmaker:latest}
    container_name: reelmaker
    restart: unless-stopped
    ports:
      - "${REELMAKER_PORT:-8080}:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/reelmaker", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 2s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Perfil opcional: certificado y renovacion automatica para un dominio propio.
  caddy:
    image: caddy:2.8-alpine
    container_name: reelmaker-caddy
    restart: unless-stopped
    profiles: ["tls"]
    depends_on:
      - reelmaker
    environment:
      REELMAKER_DOMAIN: ${REELMAKER_DOMAIN:?falta REELMAKER_DOMAIN en .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
