name: Imagen Docker

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Preparar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: server/go.mod

      - name: Revisar formato
        run: test -z "$(gofmt -l server)" || { gofmt -l server; exit 1; }

      - name: go vet
        run: go vet ./...
        working-directory: server

      - name: Pruebas
        run: go test ./...
        working-directory: server

  imagen:
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Preparar buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar a ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # En un pull request se compila solo amd64 para validar el Dockerfile;
          # las dos arquitecturas se publican al pushear a una rama o un tag.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Sin adjuntos de atestacion: el manifiesto queda con las dos
          # arquitecturas y nada mas, que es lo que hace chica a la imagen.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Medir el tamano de la imagen
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          etiqueta=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)
          repo="${etiqueta%%:*}"
          echo "### Imagen publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$etiqueta\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Arquitectura | Capas comprimidas |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$etiqueta" --raw \
            | jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture) \(.digest)"' \
            | while read -r arq digest; do
                bytes=$(docker buildx imagetools inspect "${repo}@${digest}" --raw \
                  | jq '[.layers[].size] | add // 0')
                echo "| $arq | $(( bytes / 1024 )) KiB |" >> "$GITHUB_STEP_SUMMARY"
              done
